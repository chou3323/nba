<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA 賽前預測表</title>
<style>
:root{--bg:#f6f5f1;--fg:#1a1a1a;--mut:#6b6b66;--card:#fff;--ln:#e2e0d8;--ac:#c4501c;--bl:#1b56b0;--pos:#1a7f43;--neg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#efede6;--mut:#a5a39a;--card:#1f1f1d;--ln:#34332f;--ac:#ff8a55;--bl:#6aa3ff;--pos:#4cc47f;--neg:#ff7a6b}}
:root[data-theme="dark"]{--bg:#141413;--fg:#efede6;--mut:#a5a39a;--card:#1f1f1d;--ln:#34332f;--ac:#ff8a55;--bl:#6aa3ff;--pos:#4cc47f;--neg:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;padding:0 14px 28px;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
h1{font-size:20px;margin:14px 0 2px}
.mut,small{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-weight:600}
.tabs .on{background:var(--fg);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.a{color:var(--ac)}.h{color:var(--bl)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12.5px;color:var(--mut);margin:6px 0 2px}
input,select,button.go{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button.go{background:var(--fg);color:var(--bg);font-weight:600;margin-top:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg);margin:8px 0 0}
.chk input{width:auto}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
details{margin-top:10px}
summary{font-weight:600;cursor:pointer}
ol{padding-left:20px;margin:6px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:1px}
.tag.ok{background:var(--pos)}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:16px;padding:5px 10px;margin:3px 4px 0 0;font:inherit;font-size:13px}
.chip.on{background:var(--neg);border-color:var(--neg);color:#fff}
input.man{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--bg))}
</style>
</head>
<body>
<h1>🏀 NBA 賽前預測表</h1>
<div class="mut">照影片的 Excel 做法：算得分、模擬一萬場、對照市場指數。球隊數據到 11/14，賠率約 11/15 03:00 UTC。</div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
<p class="mut">數據來源：Basketball-Reference（球隊場均得失分）、Land of Basketball（球員場均得分，前 50 名）、FanDuel／BangTheBook（盤口，已換算成香港賠率）。頁面內是 11/15 的快照，不會自動更新。僅供學習，不是投注建議。</p>
<script>
const T=`ATL|老鷹|13|118.2|116.8|118.5|116.0
BOS|塞爾提克|12|114.3|103.1|114.9|107.2
BKN|籃網|11|110.2|115.3|105.9|115.9
CHA|黃蜂|12|98.6|109.6|116.0|111.2
CHI|公牛|11|114.4|127.7|116.3|121.5
CLE|騎士|13|116.8|115.8|119.5|115.4
DAL|獨行俠|12|113.2|112.2|114.1|119.6
DEN|金塊|10|114.5|113.3|122.1|116.9
DET|活塞|11|115.5|107.8|117.8|109.6
GSW|勇士|13|116.7|112.4|114.6|115.2
HOU|火箭|13|116.2|107.4|115.2|110.0
IND|溜馬|13|111.2|113.2|112.4|120.4
LAC|快艇|11|112.3|117.5|113.8|112.6
LAL|湖人|13|122.2|114.2|116.3|114.6
MEM|灰熊|12|119.9|111.8|114.7|120.7
MIA|熱火|12|117.2|120.1|120.9|118.5
MIL|公鹿|13|106.2|120.2|110.6|116.8
MIN|灰狼|12|119.3|105.9|118.0|114.6
NOP|鵜鶘|13|116.5|125.6|115.5|120.0
NYK|尼克|12|109.8|103.7|116.5|110.1
OKC|雷霆|13|111.2|107.4|119.0|107.9
ORL|魔術|12|108.3|112.8|115.7|115.1
PHI|76人|13|111.2|109.4|115.9|116.1
PHX|太陽|11|111.7|116.1|112.6|111.1
POR|拓荒者|12|119.6|111.8|115.5|115.8
SAC|國王|12|108.2|120.9|111.0|121.0
SAS|馬刺|13|119.5|106.2|119.8|111.5
TOR|暴龍|12|114.3|112.8|114.6|111.8
UTA|爵士|13|107.5|118.6|117.6|126.0
WAS|巫師|13|110.0|115.8|112.9|124.9`.split("\n").map(r=>{const p=r.split("|");return{k:p[0],n:p[1],g:+p[2],o:+p[3],d:+p[4],lo:+p[5],ld:+p[6]}});
const tm=Object.fromEntries(T.map(t=>[t.k,t]));
const LG=113.5;
const PL=`LAL|Luka Doncic|38.6
OKC|Shai Gilgeous-Alexander|30.5
MIA|Giannis Antetokounmpo|28.9
SAS|Victor Wembanyama|28.8
GSW|Stephen Curry|27.8
PHI|Tyrese Maxey|26.7
NYK|Jalen Brunson|26.6
BOS|Jayson Tatum|26.3
DEN|Jamal Murray|25.9
DET|Cade Cunningham|25.7
WAS|Anthony Davis|25.6
PHX|Devin Booker|25.5
SAC|Darius Acuff Jr.|25.4
MEM|Ty Jerome|25.4
LAL|Austin Reaves|24.7
ORL|Franz Wagner|24.4
DAL|Cooper Flagg|24.1
POR|Deni Avdija|23.9
DEN|Nikola Jokic|23.7
HOU|Alperen Sengun|23.1
CLE|Donovan Mitchell|23.0
DAL|Kyrie Irving|22.7
IND|Pascal Siakam|22.4
BOS|Paul George|22.0
NOP|Zion Williamson|21.9
MIL|Tyler Herro|21.6
BKN|Michael Porter Jr.|21.5
ATL|Nickeil Alexander-Walker|21.5
SAC|Zach LaVine|21.4
TOR|RJ Barrett|21.3
PHI|Jaylen Brown|21.2
CHI|Norman Powell|21.1
NYK|Karl-Anthony Towns|21.1
HOU|Kevin Durant|21.0
UTA|Keyonte George|20.9
LAC|Darius Garland|20.7
CHA|Brandon Miller|20.6
POR|Damian Lillard|20.6
GSW|Yaxel Lendeborg|20.2
ATL|Jalen Johnson|20.0
BKN|Julius Randle|19.9
WAS|Trae Young|19.7
MIA|Bam Adebayo|19.5
CHI|Caleb Wilson|18.9
MIN|LaMelo Ball|18.6
MIN|Ayo Dosunmu|18.5
OKC|Ajay Mitchell|18.5
ORL|Desmond Bane|18.3
WAS|Kyshawn George|18.2
PHI|Joel Embiid|17.9`.split("\n").map(r=>{const p=r.split("|");return{t:p[0],n:p[1],p:+p[2]}});
let OA=new Set(),OH=new Set();
const outPts=(s,k)=>PL.filter(x=>x.t==k&&(s?OH:OA).has(x.n)).reduce((a,x)=>a+x.p,0);
function chips(s){const k=document.getElementById(s?"h":"a").value,L=PL.filter(x=>x.t==k);return`<div class="mut">${s?"主隊":"客隊"} ${tm[k].n}</div>`+(L.length?L.map(x=>`<button type="button" class="chip${(s?OH:OA).has(x.n)?" on":""}" onclick="tg(${s},'${x.n}')">${x.n} ${x.p}</button>`).join(""):"")+`<div style="margin-top:6px"><input id="cn${s}" placeholder="其他球員名字" style="width:44%"> <input id="cp${s}" type="number" step="0.1" placeholder="場均得分" style="width:26%"> <button type="button" class="chip" onclick="ad(${s})">＋缺陣</button></div>`}
function ad(s){const k=document.getElementById(s?"h":"a").value,q=id=>document.getElementById(id+s),n=q("cn").value.replace(/['"\\<>]/g,"").trim(),p=parseFloat(q("cp").value);if(!n||isNaN(p))return;if(!PL.some(x=>x.t==k&&x.n==n))PL.push({t:k,n:n,p:p});(s?OH:OA).add(n);upd()}
function tg(s,n){const Z=s?OH:OA;Z.has(n)?Z.delete(n):Z.add(n);upd()}
const P={K:10,H:0.9,B:1,pace:6,sd:10.5,N:10000,R:0.5};
// [客,主,美東開賽時,客背靠背,主背靠背,客獨贏,主獨贏,主隊讓分,大小分]
const S=[["IND","PHI",13,0,0,2.4,0.339,-7.5,221.5],["LAL","PHX",16,0,0,null,null,null,null],["CHA","LAC",16.5,0,0,null,null,null,null],["SAS","UTA",17,0,0,0.061,9.2,17.5,224.5],["DAL","BOS",18,1,0,null,null,null,null],["NYK","TOR",18,0,0,0.592,1.42,4.5,217.5],["HOU","WAS",19,0,0,0.25,3.15,8.5,222.5],["ATL","MIL",20,0,0,0.348,2.34,6.5,232.5],["OKC","SAC",21,0,0,null,null,null,null]]
.map(s=>({a:s[0],h:s[1],t:s[2],ab:s[3],hb:s[4],mlA:s[5],mlH:s[6],line:s[7],tot:s[8],ai:0,hi:0}));
const bl=t=>({o:(t.g*t.o+P.K*t.lo)/(t.g+P.K),d:(t.g*t.d+P.K*t.ld)/(t.g+P.K)});
const rn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const dec=a=>1+a;
const pc=x=>(x*100).toFixed(1)+"%";
const sg=x=>(x>=0?"+":"")+(x*100).toFixed(1)+"%";
const num=x=>x===""||x==null||isNaN(+x)?null:+x;
function calc(g){
 const A=bl(tm[g.a]),H=bl(tm[g.h]);
 const bh=H.o+A.d-LG,ba=A.o+H.d-LG;
 const ah=P.H+(g.hb?-P.B:0)+(g.ab?P.B:0)+g.hi;
 const aa=-P.H+(g.ab?-P.B:0)+(g.hb?P.B:0)+g.ai;
 const ph=bh+ah,pa=ba+aa;
 let hw=0,aw=0,cv=0,ov=0,sum=0;const hist=new Array(21).fill(0);
 for(let i=0;i<P.N;i++){
  const pace=rn()*P.pace;
  const h=Math.round(ph+rn()*P.sd+pace),a=Math.round(pa+rn()*P.sd+pace),d=h-a;
  if(d>0)hw++;else if(d<0)aw++;
  if(g.line!=null&&d+g.line>0)cv++;
  if(g.tot!=null&&h+a>g.tot)ov++;
  sum+=d;hist[Math.max(0,Math.min(20,Math.floor((d+42)/4)))]++;
 }
 const r={bh,ba,ah,aa,ph,pa,wp:hw/(hw+aw),cv:cv/P.N,ov:ov/P.N,md:sum/P.N,hist};
 if(g.mlA!=null&&g.mlH!=null){
  const da=dec(g.mlA),dh=dec(g.mlH),ia=1/da,ih=1/dh,s=ia+ih;
  Object.assign(r,{da,dh,ia,ih,s,fa:ia/s,fh:ih/s,eva:(1-r.wp)*da-1,evh:r.wp*dh-1});
 }
 return r;
}
function hs(h){const m=Math.max(...h);return`<svg viewBox="0 0 210 56" width="100%" style="display:block;margin-top:6px">`+h.map((v,i)=>`<rect x="${i*10+1}" y="${52-v/m*50}" width="8" height="${v/m*50}" rx="1.5" fill="${-40+4*i>0?"var(--bl)":"var(--ac)"}"/>`).join("")+`<line x1="105" x2="105" y1="0" y2="54" stroke="var(--mut)" stroke-dasharray="2 2"/></svg><div class="row mut"><span>客隊贏 ←</span><span>分差（主−客）</span><span>→ 主隊贏</span></div>`}
function res(g,r,full){
 const A=tm[g.a].n,H=tm[g.h].n;
 let o=`<div class="row"><div><span class="a">${A}</span><div class="big a">${r.pa.toFixed(1)}</div></div><div style="text-align:right"><span class="h">${H}（主）</span><div class="big h">${r.ph.toFixed(1)}</div></div></div>
 <div class="bar"><i style="width:${(1-r.wp)*100}%;background:var(--ac)"></i><i style="width:${r.wp*100}%;background:var(--bl)"></i></div>
 <div class="row"><b class="a">${pc(1-r.wp)}</b><span class="mut">模擬 ${P.N.toLocaleString()} 場勝率</span><b class="h">${pc(r.wp)}</b></div>
 <div class="mut" style="margin-top:6px">模型平均分差 主隊 ${r.md>=0?"+":""}${r.md.toFixed(1)}，總分 ${(r.ph+r.pa).toFixed(1)}</div>`;
 if(g.line!=null)o+=`<div class="mut">盤口 ${H} ${g.line>0?"受讓 +":"讓 "}${Math.abs(g.line)}：主隊過盤 ${pc(r.cv)}</div>`;
 if(g.tot!=null)o+=`<div class="mut">盤口總分 ${g.tot}：大分機率 ${pc(r.ov)}</div>`;
 if(r.da){
  o+=`<table style="margin-top:8px"><tr><th></th><th>${A}</th><th>${H}</th></tr>
  <tr><td>香港賠率</td><td>${(r.da-1).toFixed(2)}</td><td>${(r.dh-1).toFixed(2)}</td></tr>
  <tr><td>隱含機率</td><td>${pc(r.ia)}</td><td>${pc(r.ih)}</td></tr>
  <tr><td>去水機率</td><td>${pc(r.fa)}</td><td>${pc(r.fh)}</td></tr>
  <tr><td>表格機率</td><td>${pc(1-r.wp)}</td><td>${pc(r.wp)}</td></tr>
  <tr><td>期望值</td><td class="${r.eva>=0?"pos":"neg"}">${sg(r.eva)}</td><td class="${r.evh>=0?"pos":"neg"}">${sg(r.evh)}</td></tr></table>
  <div class="mut">兩邊隱含機率加起來 ${pc(r.s)}，多出的 ${((r.s-1)*100).toFixed(1)}% 是抽水。期望值 = 表格機率 × (1＋香港賠率) − 1，要大於 0 才蓋得過抽水。</div>`;
 }else o+=`<div class="mut">這場盤口還沒開，可點進「自選對戰」自己輸入賠率。</div>`;
 o+=hs(r.hist);
 if(full)o+=`<details open><summary>得分怎麼算（影片步驟）</summary><table>
  <tr><td>${H} 基礎得分</td><td>${r.bh.toFixed(1)}</td></tr><tr><td>${A} 基礎得分</td><td>${r.ba.toFixed(1)}</td></tr>
  <tr><td>${H} 主場＋背靠背＋傷病</td><td>${r.ah>=0?"+":""}${r.ah.toFixed(1)}</td></tr><tr><td>${A} 客場＋背靠背＋傷病</td><td>${r.aa>=0?"+":""}${r.aa.toFixed(1)}</td></tr></table>
  <div class="mut">基礎得分 = 己方進攻 + 對手防守 − 聯盟平均 ${LG}。進攻與防守都用「本季 × 場次 + K × 上季」除以「場次 + K」，K 預設 10。</div></details>`;
 return o;
}
function clock(h){let w=h+13;const nx=w>=24;w=w%24;return`美東 ${fm(h)}｜台灣 ${nx?"11/16 ":"11/15 "}${fm(w)}`}
const fm=h=>String(Math.floor(h)).padStart(2,"0")+":"+(h%1?"30":"00");
let tab="s",C=S[0];
function show(){
 document.getElementById("tabs").innerHTML=[["s","今日賽程"],["c","自選對戰"],["t","球隊戰力"]].map(x=>`<button class="${tab==x[0]?"on":""}" onclick="tab='${x[0]}';show()">${x[1]}</button>`).join("");
 const v=document.getElementById("v");
 if(tab=="s")v.innerHTML=`<div class="mut">11/15（日）共 9 場。<span class="tag ok">已帶入</span>是我抓的快照；<span class="tag">手填</span>要你照自己的板填。點卡片進去填。</div>`+S.map((g,i)=>{const r=calc(g);
  const tag=[g.ab?`${tm[g.a].n}背靠背`:"",g.hb?`${tm[g.h].n}背靠背`:""].filter(Boolean).join("、");
  return`<div class="card" onclick="C=S[${i}];OA.clear();OH.clear();tab='c';show();scrollTo(0,0)"><div class="mut">${clock(g.t)}${tag?"｜"+tag:""}</div><div class="mut" style="margin:4px 0">${[["賠率",g.mlA],["讓分",g.line],["總分",g.tot]].map(x=>x[1]==null?`<span class="tag">${x[0]}待填</span>`:`<span class="tag ok">${x[0]}已帶入</span>`).join("")}<span class="tag">傷病：進去選球員</span></div>${res(g,r,false).replace(/<svg[\s\S]*?<\/svg><div class="row mut">[\s\S]*?<\/div>$/,"")}</div>`}).join("");
 if(tab=="c"){
  const opt=s=>T.map(t=>`<option value="${t.k}" ${t.k==s?"selected":""}>${t.n}</option>`).join("");
  const g=C;
  v.innerHTML=`<div class="card"><div class="mut" style="margin-bottom:6px"><span class="tag">手填</span> 橘框欄位請照你自己的板填：賠率（香港）、主隊讓分、總分、傷病。我帶入的快照可能和你的板不同，以你板上的為準，直接改掉。其他都自動算。</div><div class="g2"><div><label>客隊</label><select id="a" onchange="OA.clear();upd()">${opt(g.a)}</select></div><div><label>主隊</label><select id="h" onchange="OH.clear();upd()">${opt(g.h)}</select></div></div>
  <div class="g2"><label class="chk"><input type="checkbox" id="ab" ${g.ab?"checked":""} onchange="upd()">客隊背靠背<span class="tag ok">已帶入</span></label><label class="chk"><input type="checkbox" id="hb" ${g.hb?"checked":""} onchange="upd()">主隊背靠背<span class="tag ok">已帶入</span></label></div>
  <label>缺陣球員（點名字，紅色 = 缺陣，名字旁是本季場均得分）<span class="tag">手填</span></label><div id="ca"></div><div id="ch" style="margin-top:6px"></div><label>缺陣影響比例（0.5 = 扣缺陣球員場均得分的一半）<span class="tag">手填</span></label><input class="man" id="R" type="number" step="0.05" value="${P.R}" oninput="upd()"><div class="g2"><div><label>客隊其他調整（分）<span class="tag">手填</span></label><input class="man" id="ai" type="number" step="0.5" value="${g.ai0??g.ai}" oninput="upd()"></div><div><label>主隊其他調整（分）<span class="tag">手填</span></label><input class="man" id="hi" type="number" step="0.5" value="${g.hi0??g.hi}" oninput="upd()"></div></div>
  <div class="g2"><div><label>客隊獨贏（香港賠率，如 0.65）<span class="tag">手填</span></label><input class="man" id="mlA" type="number" step="0.01" value="${g.mlA??""}" oninput="upd()"></div><div><label>主隊獨贏（香港賠率，如 1.30）<span class="tag">手填</span></label><input class="man" id="mlH" type="number" step="0.01" value="${g.mlH??""}" oninput="upd()"></div></div>
  <div class="g2"><div><label>主隊讓分（讓為負、受讓為正）<span class="tag">手填</span></label><input class="man" id="line" type="number" step="0.5" value="${g.line??""}" oninput="upd()"></div><div><label>總分盤<span class="tag">手填</span></label><input class="man" id="tot" type="number" step="0.5" value="${g.tot??""}" oninput="upd()"></div></div>
  <details><summary>進階參數</summary><div class="g2"><div><label>上季權重 K</label><input id="K" type="number" value="${P.K}" oninput="upd()"></div><div><label>主場加成（分）</label><input id="H" type="number" step="0.1" value="${P.H}" oninput="upd()"></div><div><label>節奏波動（兩隊共用）</label><input id="pace" type="number" step="0.5" value="${P.pace}" oninput="upd()"></div><div><label>各隊得分波動</label><input id="sd" type="number" step="0.5" value="${P.sd}" oninput="upd()"></div></div><div class="mut">傷病欄請自己判斷：主力缺陣，少掉的不是他全部的得分，因為出手會分給隊友。</div></details>
  <button class="go" onclick="upd()">重新模擬（等於 Excel 的 F9）</button></div><div class="card" id="res"></div>`;
  upd();
 }
 if(tab=="t"){
  const rows=T.map(t=>{const b=bl(t);return{n:t.n,g:t.g,o:b.o,d:b.d,net:b.o-b.d}}).sort((x,y)=>y.net-x.net);
  v.innerHTML=`<div class="card"><div class="mut">「合成」= 本季與上季按場次加權（K=${P.K}），早季數據少時不會被少數幾場帶偏。</div><div class="sc"><table><tr><th>球隊</th><th>場次</th><th>進攻</th><th>防守</th><th>淨值</th></tr>${rows.map(r=>`<tr><td>${r.n}</td><td>${r.g}</td><td>${r.o.toFixed(1)}</td><td>${r.d.toFixed(1)}</td><td class="${r.net>=0?"pos":"neg"}">${r.net>=0?"+":""}${r.net.toFixed(1)}</td></tr>`).join("")}</table></div></div>`;
 }
}
function upd(){
 const q=id=>document.getElementById(id);
 ["K","H","pace","sd","R"].forEach(k=>{const x=num(q(k).value);if(x!=null)P[k]=x});
 C={a:q("a").value,h:q("h").value,ab:q("ab").checked?1:0,hb:q("hb").checked?1:0,ai0:num(q("ai").value)||0,hi0:num(q("hi").value)||0,ai:(num(q("ai").value)||0)-P.R*outPts(0,q("a").value),hi:(num(q("hi").value)||0)-P.R*outPts(1,q("h").value),mlA:num(q("mlA").value),mlH:num(q("mlH").value),line:num(q("line").value),tot:num(q("tot").value),t:C.t};
 q("ca").innerHTML=chips(0);q("ch").innerHTML=chips(1);
 q("res").innerHTML=res(C,calc(C),true);
}
show();
</script>
</body>
